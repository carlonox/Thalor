services:
  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:latest
    container_name: thalor-router
    restart: unless-stopped
    ports:
      - "${ROUTER_PORT:-3000}:3000"
    volumes:
      - freellmapi_data:/app/server/data
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - ENCRYPTION_KEY=${ROUTER_ENCRYPTION_KEY}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/', (r) => process.exit(r.statusCode >= 200 && r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - thalor-net

volumes:
  freellmapi_data:

networks:
  thalor-net:
    driver: bridge
