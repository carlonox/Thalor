#       - --password
#       - ${GNS3_PASSWORD}
#     enabled: true

# Session Reset
# ---------------------------------------------------------------------------
session_reset:
  at_hour: 4
  idle_minutes: 1440
  mode: both

# File Mutation Verifier
# ---------------------------------------------------------------------------
file_mutation_verifier: false

# Config Version
# ---------------------------------------------------------------------------
_config_version: 33
